name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      label:
        required: true
        type: string
      publish-badges:
        type: boolean
        default: false
    outputs:
      built:
        description: Whether the baserom could be fetched, so the ROM was built
        value: ${{ jobs.baserom.outputs.available }}

permissions:
  contents: read

jobs:
  baserom:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          BASEROM_REPO: ${{ secrets.BASEROM_REPO }}
        run: |
          if [ -n "$BASEROM_REPO" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The BASEROM_REPO secret isn't set, so the ${{ inputs.label }} ROM can't be fetched and its build is skipped"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: baserom
    if: needs.baserom.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: command -v ninja > /dev/null || { sudo apt-get update && sudo apt-get install -y ninja-build; }

      - run: python -m pip install -r tools/requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            tools/mwccarm
            dsd
            objdiff-cli
            wibo
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/download_tool.py', 'tools/configure.py') }}

      - name: Fetch baserom and BIOS
        env:
          GH_TOKEN: ${{ secrets.BASEROM_TOKEN }}
          BASEROM_REPO: ${{ secrets.BASEROM_REPO }}
          BASEROM_TAG: ${{ vars.BASEROM_TAG }}
        run: |
          gh release download "$BASEROM_TAG" -R "$BASEROM_REPO" -p 'baserom_dqix_${{ inputs.version }}.nds' -D extract/
          gh release download "$BASEROM_TAG" -R "$BASEROM_REPO" -p 'arm7_bios.bin' -D . \
            || echo "::notice::There's no arm7_bios.bin in the baserom release, so the SHA-1 of the whole ROM isn't verified"

      - run: sha1sum -c --ignore-missing ci/baseroms_${{ inputs.version }}.sha1

      - run: python tools/configure.py ${{ inputs.version }}

      # Without the BIOS the whole ROM can't match, so only verify the modules
      - run: |
          if [ -f arm7_bios.bin ]; then
            ninja
          else
            ninja min report
          fi

      - name: Progress summary
        run: |
          {
            echo '### Progress (${{ inputs.label }})'
            echo '```'
            python tools/report_badges.py build/${{ inputs.version }}/report.json -l '${{ inputs.label }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate badge data
        if: inputs.publish-badges
        run: python tools/report_badges.py build/${{ inputs.version }}/report.json -l '${{ inputs.label }}' -o badges/${{ inputs.version }}

      - uses: actions/upload-artifact@v4
        if: inputs.publish-badges
        with:
          name: badges-${{ inputs.version }}
          path: badges/
