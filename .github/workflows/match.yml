name: Match

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: match-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # This fork only has the EUR baserom, so it doesn't build USA or JPN
  eur:
    uses: ./.github/workflows/build.yml
    with:
      version: eur
      label: EUR
      publish-badges: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit

  badges-eur:
    needs: eur
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.eur.outputs.built == 'true'
    uses: ./.github/workflows/publish-badges.yml
    with:
      version: eur
    permissions:
      contents: write
    concurrency:
      group: publish-badges
      cancel-in-progress: false

  match:
    needs: eur
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          case "${{ needs.eur.result }}" in
            success|skipped) ;;
            *) echo "eur: ${{ needs.eur.result }}"; exit 1 ;;
          esac
